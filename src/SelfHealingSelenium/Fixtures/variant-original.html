<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automation Practice Form - Original</title>
</head>
<body>
  <h1>Automation Practice Form</h1>
  <form id="practice-form">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="firstName" placeholder="Enter first name">
    </div>
    <div class="form-group">
      <label>Gender</label>
      <label for="gender-male"><input type="radio" id="gender-male" name="gender" value="Male"> Male</label>
      <label for="gender-female"><input type="radio" id="gender-female" name="gender" value="Female"> Female</label>
      <label for="gender-other"><input type="radio" id="gender-other" name="gender" value="Other"> Other</label>
    </div>
    <div class="form-group">
      <label for="state">State</label>
      <select id="state" name="state">
        <option value="">Select State</option>
        <option value="California">California</option>
        <option value="Texas">Texas</option>
        <option value="New York">New York</option>
      </select>
    </div>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
